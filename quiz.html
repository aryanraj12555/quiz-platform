<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           NAME VALIDATION
        ===================================================== */

        .name-input.name-error {
            border: 2px solid #e53935 !important;
            background: #fff5f5;
        }

        .name-error-message {
            display: none;
            color: #d32f2f;
            font-weight: 600;
            margin-top: 8px;
        }

        .name-error-message.show {
            display: block;
        }

    </style>

</head>


<body>


<!-- =====================================================
     TIMER
===================================================== -->

<div
    id="timerBar"
    class="timer-bar"
>

    <div class="timer-inner">

        <span>
            ⏱️ Time Remaining
        </span>

        <strong id="timer">
            00:00
        </strong>

    </div>

</div>


<!-- =====================================================
     QUIZ
===================================================== -->

<main class="container quiz-container">

    <div id="quiz"></div>

</main>


<script>


/* =====================================================
   QUIZ VARIABLES
===================================================== */

const code =
    new URLSearchParams(
        location.search
    ).get("code");


let quiz = null;

let startTime = null;

let timerInterval = null;

let submitted = false;


/* =====================================================
   QUESTION TIMING
===================================================== */

const questionStartTimes = {};

const questionTimes = {};


/* =====================================================
   LOAD QUIZ
===================================================== */

async function loadQuiz() {

    if (!code) {

        showError(
            "Invalid quiz link."
        );

        return;

    }


    try {

        const response =
            await fetch(
                `/api/quizzes/${encodeURIComponent(code)}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            showError(
                data.error ||
                "Quiz not found."
            );

            return;

        }


        quiz = data;


        renderQuiz();


        startTime =
            Date.now();


        startTimer();

    }

    catch (error) {

        console.error(
            "LOAD QUIZ ERROR:",
            error
        );


        showError(
            "Unable to load the quiz. Please try again."
        );

    }

}


/* =====================================================
   RENDER QUIZ
===================================================== */

function renderQuiz() {

    const container =
        document.getElementById(
            "quiz"
        );


    let html = `

        <div class="quiz-header">

            <h1>
                ${escapeHTML(
                    quiz.title
                )}
            </h1>


            ${
                quiz.description
                ? `
                    <p>
                        ${escapeHTML(
                            quiz.description
                        )}
                    </p>
                `
                : ""
            }


            <p class="muted">

                ${quiz.questions.length}
                Questions

            </p>

        </div>


        <!-- =================================================
             PARTICIPANT NAME
        ================================================= -->

        <div class="name-section">

            <label
                for="participant"
                style="
                    display:block;
                    font-weight:700;
                    margin-bottom:8px;
                "
            >
                👤 Your Name
            </label>


            <input
                id="participant"
                class="name-input"
                type="text"
                placeholder="Enter your name"
                autocomplete="name"
                maxlength="100"
            >


            <div
                id="nameError"
                class="name-error-message"
            >
                ⚠️ Please enter your name before submitting.
            </div>

        </div>

    `;


    /* =====================================================
       QUESTIONS
    ===================================================== */

    quiz.questions.forEach(
        (q, index) => {

            html += `

                <div
                    class="quiz-question"
                    data-question="${escapeHTML(
                        String(q.id)
                    )}"
                >

                    <div class="question-number">

                        Question
                        ${index + 1}
                        /
                        ${quiz.questions.length}

                    </div>


                    <h3>

                        ${escapeHTML(
                            q.question
                        )}

                    </h3>


                    <div class="options">

                        ${q.options.map(
                            (option, i) => `

                            <label
                                class="option"
                            >

                                <input
                                    type="radio"
                                    name="q-${escapeHTML(
                                        String(q.id)
                                    )}"
                                    value="${i}"
                                    onchange="
                                        questionAnswered(
                                            ${JSON.stringify(q.id)}
                                        )
                                    "
                                >


                                <span>

                                    ${escapeHTML(
                                        String(option)
                                    )}

                                </span>

                            </label>

                        `
                        ).join("")}

                    </div>

                </div>

            `;

        }
    );


    /* =====================================================
       FEEDBACK + SUBMIT
    ===================================================== */

    html += `

        <div class="feedback-box">

            <label>
                💬 Feedback
            </label>


            <textarea
                id="feedback"
                placeholder="Any feedback about this quiz?"
            ></textarea>

        </div>


        <button
            id="submitButton"
            class="success full-button"
            type="button"
            onclick="submitQuiz(false)"
        >

            Submit Quiz

        </button>

    `;


    container.innerHTML =
        html;


    /* =====================================================
       NAME INPUT EVENTS
    ===================================================== */

    const participantInput =
        document.getElementById(
            "participant"
        );


    participantInput.addEventListener(
        "input",
        function () {

            const name =
                participantInput.value.trim();


            if (name) {

                clearNameError();

            }

        }
    );


    participantInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

            }

        }
    );

}


/* =====================================================
   QUESTION ANSWERED
===================================================== */

function questionAnswered(
    questionId
) {

    if (
        questionStartTimes[
            questionId
        ] === undefined
    ) {

        questionStartTimes[
            questionId
        ] = Date.now();

    }

}


/* =====================================================
   QUESTION TIMES
===================================================== */

function calculateQuestionTimes() {

    const result = {};


    quiz.questions.forEach(
        q => {

            if (
                questionStartTimes[
                    q.id
                ] !== undefined
            ) {

                result[q.id] =
                    Math.floor(
                        (
                            Date.now() -
                            questionStartTimes[q.id]
                        ) / 1000
                    );

            }

            else {

                result[q.id] = 0;

            }

        }
    );


    return result;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    let remaining =
        Number(
            quiz.timeLimit
        ) || 600;


    updateTimer(
        remaining
    );


    timerInterval =
        setInterval(
            function () {

                remaining--;


                updateTimer(
                    remaining
                );


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    /*
                       Timer has expired.

                       We still check the name.
                       If no name was entered, the quiz
                       will NOT be submitted anonymously.
                    */

                    submitQuiz(true);

                }

            },
            1000
        );

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        seconds % 60;


    const timer =
        document.getElementById(
            "timer"
        );


    if (timer) {

        timer.textContent =
            `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;

    }


    const bar =
        document.getElementById(
            "timerBar"
        );


    if (
        bar &&
        seconds <= 60
    ) {

        bar.classList.add(
            "timer-warning"
        );

    }

}


/* =====================================================
   NAME VALIDATION
===================================================== */

function validateParticipantName() {

    const input =
        document.getElementById(
            "participant"
        );


    if (!input) {

        return false;

    }


    const name =
        input.value.trim();


    if (!name) {

        input.classList.add(
            "name-error"
        );


        const error =
            document.getElementById(
                "nameError"
            );


        if (error) {

            error.classList.add(
                "show"
            );

        }


        input.focus();


        return false;

    }


    clearNameError();


    return true;

}


/* =====================================================
   CLEAR NAME ERROR
===================================================== */

function clearNameError() {

    const input =
        document.getElementById(
            "participant"
        );


    if (input) {

        input.classList.remove(
            "name-error"
        );

    }


    const error =
        document.getElementById(
            "nameError"
        );


    if (error) {

        error.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   SUBMIT QUIZ
===================================================== */

async function submitQuiz(
    autoSubmit
) {

    if (submitted) {

        return;

    }


    /* =================================================
       NAME MUST BE ENTERED
    ================================================= */

    const participantInput =
        document.getElementById(
            "participant"
        );


    const participantName =
        participantInput
            ?.value
            .trim() || "";


    if (!participantName) {

        /*
           Do NOT set submitted = true.

           This means the participant can enter their
           name and submit again.
        */

        validateParticipantName();


        /*
           If the timer expired, tell the participant
           that their name is still required.
        */

        if (autoSubmit) {

            alert(
                "Time is up, but your quiz cannot be submitted until you enter your name."
            );

        }


        return;

    }


    /* =================================================
       VALID NAME
    ================================================= */

    clearNameError();


    submitted = true;


    clearInterval(
        timerInterval
    );


    /* =================================================
       COLLECT ANSWERS
    ================================================= */

    const answers = {};


    quiz.questions.forEach(
        q => {

            const selected =
                document.querySelector(
                    `input[name="q-${CSS.escape(String(q.id))}"]:checked`
                );


            if (selected) {

                answers[q.id] =
                    Number(
                        selected.value
                    );

            }

        }
    );


    /* =================================================
       TIME TAKEN
    ================================================= */

    const timeTaken =
        Math.min(

            Number(
                quiz.timeLimit
            ) || 600,

            Math.floor(
                (
                    Date.now() -
                    startTime
                ) / 1000
            )

        );


    /* =================================================
       FEEDBACK
    ================================================= */

    const feedback =
        document
            .getElementById(
                "feedback"
            )
            ?.value
            .trim() || "";


    /* =================================================
       SUBMIT BUTTON
    ================================================= */

    const button =
        document.getElementById(
            "submitButton"
        );


    if (button) {

        button.disabled =
            true;


        button.textContent =
            "Submitting...";

    }


    /* =================================================
       SEND TO SERVER
    ================================================= */

    try {

        const response =
            await fetch(
                `/api/quizzes/${encodeURIComponent(code)}/submit`,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            participantName,

                            answers,

                            questionTimes:
                                calculateQuestionTimes(),

                            timeTaken,

                            feedback

                        })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.error ||
                "Submission failed."
            );

        }


        showResult(
            result,
            autoSubmit
        );

    }

    catch (error) {

        console.error(
            "SUBMIT QUIZ ERROR:",
            error
        );


        submitted = false;


        if (button) {

            button.disabled =
                false;


            button.textContent =
                "Submit Quiz";

        }


        alert(
            error.message ||
            "Submission failed. Please try again."
        );

    }

}


/* =====================================================
   RESULT
===================================================== */

function showResult(
    result,
    autoSubmit
) {

    clearInterval(
        timerInterval
    );


    const timerBar =
        document.getElementById(
            "timerBar"
        );


    if (timerBar) {

        timerBar.style.display =
            "none";

    }


    const quizContainer =
        document.getElementById(
            "quiz"
        );


    quizContainer.innerHTML = `

        <div class="result-box">

            ${
                autoSubmit
                ? `
                    <div class="time-up">

                        ⏰ Time's up!

                    </div>
                `
                : ""
            }


            <h1>
                🎉 Quiz Completed!
            </h1>


            <div class="score-circle">

                ${result.score}
                /
                ${result.total}

            </div>


            <h2>

                Accuracy:
                ${result.accuracy}%

            </h2>


            <p>

                ⏱️ Time Taken:

                <strong>

                    ${formatTime(
                        result.timeTaken
                    )}

                </strong>

            </p>


            <button
                type="button"
                onclick="location.reload()"
            >

                Try Again

            </button>

        </div>

    `;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
) {

    const quizContainer =
        document.getElementById(
            "quiz"
        );


    if (!quizContainer) {

        return;

    }


    quizContainer.innerHTML = `

        <div class="result-box">

            <h2>
                ❌ ${escapeHTML(message)}
            </h2>

        </div>

    `;

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return `${minutes}m ${String(
        remaining
    ).padStart(2, "0")}s`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text ?? "");


    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

loadQuiz();

</script>

</body>

</html>
