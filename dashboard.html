<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* =====================================================
           QUESTION REVIEW
        ===================================================== */

        .attempt-review {
            margin-top: 18px;
        }


        .review-toggle {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
            background: #eef1ff;
            color: #4038b5;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
        }


        .review-toggle:hover {
            background: #e3e6ff;
        }


        .review-content {
            display: none;
            margin-top: 12px;
        }


        .review-content.show {
            display: block;
        }


        .review-question {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            background: #fff;
        }


        .review-question.correct {
            border-left: 5px solid #168a4a;
            background: #f5fcf7;
        }


        .review-question.wrong {
            border-left: 5px solid #d93025;
            background: #fff7f7;
        }


        .review-question.unanswered {
            border-left: 5px solid #777;
            background: #f7f7f7;
        }


        .review-status {
            font-weight: 800;
            margin-bottom: 8px;
        }


        .review-status.correct {
            color: #168a4a;
        }


        .review-status.wrong {
            color: #d93025;
        }


        .review-status.unanswered {
            color: #666;
        }


        .review-question-text {
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 12px;
        }


        .review-option {
            padding: 9px 11px;
            border-radius: 8px;
            margin: 6px 0;
            background: #f3f3f3;
        }


        .review-option.selected {
            font-weight: 700;
        }


        .review-option.correct-answer {
            border-left: 4px solid #168a4a;
            background: #eaf8ef;
            font-weight: 700;
        }


        .review-option.wrong-answer {
            border-left: 4px solid #d93025;
            background: #ffecec;
            font-weight: 700;
        }


        .review-time {
            margin-top: 12px;
            color: #666;
            font-size: 14px;
        }


        .review-summary {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 15px;
        }


        .review-summary-box {
            padding: 12px;
            border-radius: 10px;
            background: #f5f5f5;
            text-align: center;
        }


        .review-summary-box strong {
            display: block;
            font-size: 20px;
        }


        .review-summary-box span {
            color: #777;
            font-size: 13px;
        }


        @media (max-width: 650px) {

            .review-summary {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVBAR
===================================================== -->

<header class="navbar">

    <h2>
        📊 Dashboard
    </h2>


    <a href="create.html">
        New Quiz
    </a>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

    <div id="dashboard">

        <div class="card">

            <p>
                ⏳ Loading dashboard...
            </p>

        </div>

    </div>

</main>


<script>


/* =====================================================
   CODE
===================================================== */

const code =
    new URLSearchParams(
        location.search
    ).get("code");


/* =====================================================
   GLOBAL DATA
===================================================== */

let dashboardData = null;


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard() {

    const dashboard =
        document.getElementById(
            "dashboard"
        );


    if (!code) {

        dashboard.innerHTML = `

            <div class="result-box">

                <h2>
                    ❌ Invalid dashboard link
                </h2>

                <p>
                    No quiz code was provided.
                </p>

            </div>

        `;

        return;

    }


    try {

        const response =
            await fetch(
                `/api/quizzes/${encodeURIComponent(code)}/dashboard`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Quiz not found."
            );

        }


        dashboardData =
            data;


        renderDashboard();

    }

    catch (error) {

        console.error(
            "DASHBOARD ERROR:",
            error
        );


        dashboard.innerHTML = `

            <div class="result-box">

                <h2>
                    ❌ Unable to load dashboard
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

            </div>

        `;

    }

}


/* =====================================================
   RENDER DASHBOARD
===================================================== */

function renderDashboard() {

    const data =
        dashboardData;


    const stats =
        data.statistics;


    document
        .getElementById(
            "dashboard"
        )
        .innerHTML = `

            <!-- =========================================
                 HEADER
            ========================================== -->

            <div class="dashboard-header">

                <h1>
                    ${escapeHTML(
                        data.quiz.title
                    )}
                </h1>


                <p>

                    ${escapeHTML(
                        data.quiz.description ||
                        ""
                    )}

                </p>


                <!-- SHARE LINK -->

                <div class="share-section">

                    <strong>
                        🔗 Share Link
                    </strong>


                    <input
                        id="shareLink"
                        value="${escapeAttribute(
                            `${location.origin}/quiz.html?code=${code}`
                        )}"
                        readonly
                    >


                    <button
                        type="button"
                        onclick="copyShareLink()"
                    >

                        📋 Copy Link

                    </button>

                </div>


                <!-- ACTIONS -->

                <div class="dashboard-actions">

                    <a
                        href="/api/quizzes/${encodeURIComponent(code)}/export"
                    >

                        📥 Export CSV

                    </a>


                    <button
                        class="danger"
                        type="button"
                        onclick="deleteQuiz()"
                    >

                        🗑️ Delete Quiz

                    </button>

                </div>

            </div>


            <!-- =========================================
                 STATISTICS
            ========================================== -->

            <h2>
                📈 Statistics
            </h2>


            <div class="stats">

                <div class="stat">

                    <span>
                        Attempts
                    </span>

                    <strong>
                        ${stats.attempts || 0}
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Average Accuracy
                    </span>

                    <strong>
                        ${Number(
                            stats.average_accuracy ||
                            0
                        ).toFixed(1)}%
                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Average Time
                    </span>

                    <strong>

                        ${formatTime(
                            Math.round(
                                stats.average_time ||
                                0
                            )
                        )}

                    </strong>

                </div>


                <div class="stat">

                    <span>
                        Highest Score
                    </span>

                    <strong>
                        ${stats.highest_score || 0}
                    </strong>

                </div>

            </div>


            <!-- =========================================
                 PARTICIPANTS
            ========================================== -->

            <h2>
                👥 Participant Results
            </h2>


            <div id="attempts">

                ${renderAttempts(
                    data.attempts
                )}

            </div>

        `;

}


/* =====================================================
   RENDER ATTEMPTS
===================================================== */

function renderAttempts(
    attempts
) {

    if (
        !attempts ||
        attempts.length === 0
    ) {

        return `

            <div class="card">

                <p>
                    No one has attempted
                    this quiz yet.
                </p>

            </div>

        `;

    }


    return attempts.map(
        (attempt, index) => {

            const correctCount =
                attempt.score;


            const unansweredCount =
                calculateUnanswered(
                    attempt
                );


            const wrongCount =
                Math.max(
                    0,
                    attempt.total -
                    correctCount -
                    unansweredCount
                );


            return `

                <div
                    class="attempt"
                    id="attempt-${attempt.id}"
                >

                    <!-- =================================
                         ATTEMPT HEADER
                    ================================== -->

                    <div class="attempt-top">

                        <h3>

                            ${index + 1}.
                            ${escapeHTML(
                                attempt.participant_name
                            )}

                        </h3>


                        <span>

                            ${new Date(
                                attempt.submitted_at
                            ).toLocaleString()}

                        </span>

                    </div>


                    <!-- =================================
                         SCORE
                    ================================== -->

                    <div class="attempt-grid">

                        <div>

                            <small>
                                Score
                            </small>

                            <strong>

                                ${attempt.score}
                                /
                                ${attempt.total}

                            </strong>

                        </div>


                        <div>

                            <small>
                                Accuracy
                            </small>

                            <strong>

                                ${attempt.accuracy}%

                            </strong>

                        </div>


                        <div>

                            <small>
                                Time Taken
                            </small>

                            <strong>

                                ${formatTime(
                                    attempt.time_taken
                                )}

                            </strong>

                        </div>

                    </div>


                    <!-- =================================
                         QUICK BREAKDOWN
                    ================================== -->

                    <div class="review-summary">

                        <div
                            class="review-summary-box"
                        >

                            <strong>
                                ${correctCount}
                            </strong>

                            <span>
                                ✅ Correct
                            </span>

                        </div>


                        <div
                            class="review-summary-box"
                        >

                            <strong>
                                ${wrongCount}
                            </strong>

                            <span>
                                ❌ Wrong
                            </span>

                        </div>


                        <div
                            class="review-summary-box"
                        >

                            <strong>
                                ${unansweredCount}
                            </strong>

                            <span>
                                ⚪ Not Attempted
                            </span>

                        </div>

                    </div>


                    <!-- =================================
                         REVIEW BUTTON
                    ================================== -->

                    <div class="attempt-review">

                        <button
                            class="review-toggle"
                            type="button"
                            onclick="toggleReview(${attempt.id})"
                        >

                            🔍 View Question-by-Question Results

                        </button>


                        <div
                            id="review-${attempt.id}"
                            class="review-content"
                        >

                            ${renderQuestionReview(
                                attempt
                            )}

                        </div>

                    </div>


                    <!-- =================================
                         FEEDBACK
                    ================================== -->

                    <div class="feedback">

                        <strong>
                            💬 Feedback
                        </strong>


                        <p>

                            ${
                                attempt.feedback
                                ? escapeHTML(
                                    attempt.feedback
                                )
                                : "No feedback provided."
                            }

                        </p>

                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =====================================================
   CALCULATE UNANSWERED
===================================================== */

function calculateUnanswered(
    attempt
) {

    const questions =
        dashboardData.questions;


    let unanswered = 0;


    questions.forEach(
        question => {

            const answer =
                attempt.answers?.[
                    question.id
                ];


            if (
                answer === undefined ||
                answer === null ||
                answer === ""
            ) {

                unanswered++;

            }

        }
    );


    return unanswered;

}


/* =====================================================
   QUESTION REVIEW
===================================================== */

function renderQuestionReview(
    attempt
) {

    const questions =
        dashboardData.questions;


    return questions.map(
        (question, index) => {

            const selected =
                attempt.answers?.[
                    question.id
                ];


            const correct =
                Number(
                    question.correctAnswer
                );


            const hasAnswer =
                selected !== undefined &&
                selected !== null &&
                selected !== "";


            let statusClass;
            let statusText;


            if (!hasAnswer) {

                statusClass =
                    "unanswered";

                statusText =
                    "⚪ Not Attempted";

            }

            else if (
                Number(selected) === correct
            ) {

                statusClass =
                    "correct";

                statusText =
                    "✅ Correct";

            }

            else {

                statusClass =
                    "wrong";

                statusText =
                    "❌ Wrong";

            }


            const time =
                attempt.question_times?.[
                    question.id
                ] || 0;


            return `

                <div
                    class="
                        review-question
                        ${statusClass}
                    "
                >

                    <!-- STATUS -->

                    <div
                        class="
                            review-status
                            ${statusClass}
                        "
                    >

                        ${statusText}

                    </div>


                    <!-- QUESTION -->

                    <div class="review-question-text">

                        Q${index + 1}.
                        ${escapeHTML(
                            question.question
                        )}

                    </div>


                    <!-- OPTIONS -->

                    <div>

                        ${question.options.map(
                            (option, optionIndex) => {

                                const isCorrect =
                                    optionIndex ===
                                    correct;


                                const isSelected =
                                    hasAnswer &&
                                    Number(selected) ===
                                    optionIndex;


                                let classes =
                                    "review-option";


                                if (
                                    isCorrect
                                ) {

                                    classes +=
                                        " correct-answer";

                                }


                                if (
                                    isSelected &&
                                    !isCorrect
                                ) {

                                    classes +=
                                        " wrong-answer";

                                }


                                let prefix = "";


                                if (
                                    isCorrect
                                ) {

                                    prefix =
                                        "✓ Correct: ";

                                }

                                else if (
                                    isSelected
                                ) {

                                    prefix =
                                        "Your answer: ";

                                }


                                return `

                                    <div
                                        class="${classes}"
                                    >

                                        ${prefix}
                                        ${escapeHTML(
                                            String(option)
                                        )}

                                    </div>

                                `;

                            }
                        ).join("")}

                    </div>


                    <!-- TIME -->

                    <div class="review-time">

                        ⏱️ Time on question:
                        <strong>
                            ${formatTime(
                                Number(time)
                            )}
                        </strong>

                    </div>

                </div>

            `;

        }
    ).join("");

}


/* =====================================================
   TOGGLE QUESTION REVIEW
===================================================== */

function toggleReview(
    attemptId
) {

    const review =
        document.getElementById(
            `review-${attemptId}`
        );


    if (!review) {

        return;

    }


    review.classList.toggle(
        "show"
    );

}


/* =====================================================
   COPY SHARE LINK
===================================================== */

async function copyShareLink() {

    const input =
        document.getElementById(
            "shareLink"
        );


    if (!input) {

        return;

    }


    try {

        await navigator.clipboard.writeText(
            input.value.trim()
        );


        alert(
            "Share link copied!"
        );

    }

    catch {

        input.select();

        document.execCommand(
            "copy"
        );


        alert(
            "Share link copied!"
        );

    }

}


/* =====================================================
   DELETE QUIZ
===================================================== */

async function deleteQuiz() {

    const confirmed =
        confirm(
            "Delete this quiz and all its responses?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/quizzes/${encodeURIComponent(code)}`,
                {
                    method:
                        "DELETE"
                }
            );


        if (response.ok) {

            alert(
                "Quiz deleted."
            );


            location.href =
                "create.html";

        }

        else {

            const result =
                await response.json();


            alert(
                result.error ||
                "Could not delete quiz."
            );

        }

    }

    catch (error) {

        alert(
            "Could not delete quiz."
        );

    }

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    seconds
) {

    seconds =
        Math.max(
            0,
            Number(seconds) || 0
        );


    const minutes =
        Math.floor(
            seconds / 60
        );


    const remaining =
        seconds % 60;


    return `${minutes}m ${String(
        remaining
    ).padStart(2, "0")}s`;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            text ?? ""
        );


    return div.innerHTML;

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(
    text
) {

    return String(
        text ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* =====================================================
   START
===================================================== */

loadDashboard();

</script>

</body>

</html>
