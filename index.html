<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QuizHub</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header class="navbar">

    <h2>🧠 QuizHub</h2>

    <a href="create.html">
        Create Quiz
    </a>

</header>


<main>

    <section class="hero">

        <h1>
            Create. Share. Analyze.
        </h1>

        <p>
            Import your questions,
            create a quiz and share it.
        </p>

        <a href="create.html">

            <button>
                📥 Import Questions
            </button>

        </a>

    </section>


    <section class="features">

        <div class="card">

            <h2>📥 Import</h2>

            <p>
                Import your questions
                using a JSON file.
            </p>

        </div>


        <div class="card">

            <h2>🔗 Share</h2>

            <p>
                Every quiz gets its own
                unique shareable link.
            </p>

        </div>


        <div class="card">

            <h2>📊 Analyze</h2>

            <p>
                See scores, accuracy,
                time and feedback.
            </p>

        </div>

    </section>

</main>

</body>

</html>
